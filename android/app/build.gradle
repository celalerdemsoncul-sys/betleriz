apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Optional Firebase: add a configuration for com.betleriz.app before enabling.
if (file("google-services.json").exists()) { apply plugin: "com.google.gms.google-services" }




react {

    autolinkLibrariesWithApp()
}


def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def loadDotEnv = {
    def env = [:]
    def envFile = rootProject.file("../.env")
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def t = line.trim()
            if (t && !t.startsWith("#") && t.contains("=")) {
                def i = t.indexOf("=")
                def key = t.substring(0, i).trim()
                def val = t.substring(i + 1).trim()
                if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                    val = val.substring(1, val.length() - 1)
                }
                env[key] = val
            }
        }
    }
    return env
}()

def envOrProp = { String envKey, String gradleProp, String fallback ->
    loadDotEnv.get(envKey)
        ?: (project.hasProperty(gradleProp) ? project.property(gradleProp) : fallback)
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.betleriz.app"
    defaultConfig {
        applicationId "com.betleriz.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        manifestPlaceholders = [betlerizAdMobAppId: project.findProperty("BETLERIZ_ADMOB_APP_ID") ?: "ca-app-pub-3940256099942544~3347511713"]
        buildConfigField "String", "BETLERIZ_REWARDED_AD_UNIT", groovy.json.JsonOutput.toJson((project.findProperty("BETLERIZ_REWARDED_AD_UNIT") ?: "ca-app-pub-3940256099942544/5224354917").toString())
        versionCode 7
        versionName "1.3.3"
    }
    buildTypes {
        release {
            // Configure Betleriz release signing before store submission.
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true 
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }
    
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
    }
}

dependencies {
    implementation("com.google.android.gms:play-services-ads:24.0.0")
    implementation("com.google.android.ump:user-messaging-platform:4.0.0")
    implementation("com.facebook.react:react-android")
    implementation 'com.android.billingclient:billing:6.1.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'com.google.firebase:firebase-analytics:21.6.2'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
